services:
  agentd:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    command: ["sh", "-c", "rm -f /run/speclock/agentd.sock && exec node packages/agentd/daemon/agentd.mjs"]
    environment:
      AGENTD_DATA_DIR: /data
      AGENTD_PORT: ""
      AGENTD_PIPE: /run/speclock/agentd.sock
      AGENTD_IDLE_MIN: "1440"
    volumes:
      - speclock-data:/data
      - speclock-sock:/run/speclock
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "import('@speclock-scaffold/agentd/client').then(m => m.connect({ start: false })).then(c => c.call('hello')).then(() => process.exit(0)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  gateway:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    command: ["node", "packages/backend/src/server.mjs"]
    environment:
      APP_GIT_SHA: ${GIT_SHA:-local}
      AGENTD_DATA_DIR: /data
      AGENTD_PORT: ""
      AGENTD_PIPE: /run/speclock/agentd.sock
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8787"
      SERVE_WEB_DIST: "1"
    volumes:
      - speclock-data:/data
      - speclock-sock:/run/speclock
    depends_on:
      agentd:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - "127.0.0.1:${SPECLOCK_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  speclock-data:
  speclock-sock:
